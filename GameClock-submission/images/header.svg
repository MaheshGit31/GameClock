<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f5a3a"/>
      <stop offset="1" stop-color="#123d27"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="2">
    <path d="M0 340H180L220 300H420"/>
    <path d="M0 60H120L160 100H300"/>
    <path d="M1200 340H1050L1010 300H900"/>
    <path d="M1200 60H1090L1050 100H960"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.6">
    <circle cx="420" cy="300" r="5"/><circle cx="300" cy="100" r="5"/>
    <circle cx="900" cy="300" r="5"/><circle cx="960" cy="100" r="5"/>
  </g>

  <!-- title -->
  <text x="70" y="170" font-family="Verdana, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="2" fill="url(#title)" filter="url(#glow)">GameClock</text>
  <text x="74" y="222" font-family="Verdana, Arial, sans-serif" font-size="27" fill="#e2e8f0">The alarm clock you have to <tspan fill="#f472b6" font-weight="700">beat</tspan> to snooze.</text>
  <text x="74" y="272" font-family="Consolas, Menlo, monospace" font-size="19" fill="#94a3b8">XIAO ESP32-C3  •  ST7789 display  •  4 mechanical switches</text>

  <!-- pills -->
  <g font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <rect x="74" y="300" width="130" height="34" rx="17" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee"/>
    <text x="139" y="323" fill="#22d3ee">MEMORY</text>
    <rect x="216" y="300" width="100" height="34" rx="17" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa"/>
    <text x="266" y="323" fill="#a78bfa">MATH</text>
    <rect x="328" y="300" width="100" height="34" rx="17" fill="#f472b6" fill-opacity="0.15" stroke="#f472b6"/>
    <text x="378" y="323" fill="#f472b6">MASH</text>
    <rect x="440" y="300" width="120" height="34" rx="17" fill="#facc15" fill-opacity="0.15" stroke="#facc15"/>
    <text x="500" y="323" fill="#facc15">TIMING</text>
  </g>

  <!-- clock illustration -->
  <g transform="translate(700 70)">
    <rect x="0" y="0" width="440" height="260" rx="26" fill="url(#pcb)" stroke="#0a2a1a" stroke-width="4"/>
    <g fill="#0a1a12"><circle cx="24" cy="24" r="8"/><circle cx="416" cy="24" r="8"/><circle cx="24" cy="236" r="8"/><circle cx="416" cy="236" r="8"/></g>
    <!-- traces on PCB -->
    <g fill="none" stroke="#e2b34a" stroke-opacity="0.55" stroke-width="2">
      <path d="M110 150V190H150"/><path d="M330 150V190H290"/><path d="M220 150V200"/>
    </g>
    <!-- display -->
    <rect x="70" y="34" width="300" height="86" rx="10" fill="#05070f" stroke="#334155" stroke-width="4"/>
    <text x="220" y="98" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="62" font-weight="700" fill="#22d3ee" filter="url(#glow)">07:00</text>
    <text x="352" y="52" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#f472b6">ALARM</text>
    <!-- buzzer -->
    <circle cx="404" cy="70" r="0" fill="#111827" stroke="#334155" stroke-width="3"/>
    <circle cx="404" cy="70" r="0" fill="#f59e0b"/>
    <circle cx="398" cy="238" r="0"/><!-- keys -->
    <g>
      <rect x="60" y="148" width="66" height="66" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
      <rect x="68" y="154" width="50" height="46" rx="8" fill="#22d3ee"/>
      <rect x="140" y="148" width="66" height="66" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
      <rect x="148" y="154" width="50" height="46" rx="8" fill="#a78bfa"/>
      <rect x="234" y="148" width="66" height="66" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
      <rect x="242" y="154" width="50" height="46" rx="8" fill="#facc15"/>
      <rect x="314" y="148" width="66" height="66" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="3"/>
      <rect x="322" y="154" width="50" height="46" rx="8" fill="#f472b6"/>
    </g>
    <g font-family="Verdana, Arial, sans-serif" font-size="12" font-weight="800" fill="#0b1020" text-anchor="middle">
      <text x="93" y="184">MENU</text><text x="173" y="184">UP</text><text x="267" y="184">DOWN</text><text x="347" y="184">SNOOZE</text>
    </g>
  </g>
</svg>
